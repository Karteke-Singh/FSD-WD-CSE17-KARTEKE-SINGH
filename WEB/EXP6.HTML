<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <style>
        input{
            text-align: center;
        }
    </style>
</head>
<body style="text-align: center;">
    <p>First Name:- <input type="text" placeholder="First Name"></p>
    <p>Last Name:- <input type="text" placeholder="Last Name"></p>
    <p>Password:- <input type="password" placeholder="Password"></p>
    <p>Mobile Number:- <button>+91</button><input type="number" placeholder="Mobile Number"></p>
    <p>E-mail:- <input type="email" placeholder="e-mail Id"></p>
    <p>Sex:- </p>
    <input type="radio" id="male" name= "Sex" value="Male">Male
    <input type="radio" id="female" name= "Sex" value="female">Female
    <p>Date of Birth:- <input type="date"</p>
    <p>Language Known:-</p>
    <input type="radio" id="English" name="Language" value="English">English
    <input type="radio" id="Telugu" name="Language" value="Telugu">Telugu
    <input type="radio" id="Hindi" name="Language" value="Hindi">Hindi
    <input type="radio" id="Tamil" name="Language" value="Tamil">Tamil
    <script>
        function validateForm() {
    let name = document.getElementById("name").value.trim();
    let password = document.getElementById("password").value.trim();

    let namePattern = /^[A-Za-z\s]+$/;

    if (!name.match(namePattern) || name.length < 6) {
        alert("Name should contain only alphabets and be at least 6 characters long.");
        return false;
    }

    if (password.length < 6) {
        alert("Password should be at least 6 characters long.");
        return false;
    }

    alert("Form submitted successfully!");
    return true;
}

    </script>

</body>
</html
